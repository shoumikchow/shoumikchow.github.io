name = "shoumikchow-now"
main = "src/index.ts"
compatibility_date = "2024-01-01"
workers_dev = true

[[kv_namespaces]]
binding = "KV"
id = "feb57135336c4b17b58e2d0cf443ae2b"

# Workers AI, for /chat. No API key and no secret to rotate — the binding is the
# credential, and inference is billed in neurons against the account's free
# daily allowance rather than to a third party.
[ai]
binding = "AI"

# Per-IP burst control for /chat. `period` only accepts 10 or 60, so this bounds
# the rate, not the daily total; the DAILY_CAP in src/chat.ts does the latter.
[[ratelimits]]
name = "CHAT_LIMIT"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[observability]
[observability.logs]
enabled = true
invocation_logs = true

# Set secrets via: npx wrangler secret put <NAME>
# Required for Spotify:
#   SPOTIFY_CLIENT_ID
#   SPOTIFY_CLIENT_SECRET
#   SPOTIFY_REFRESH_TOKEN
# Required for Letterboxd movie details (runtime, director, genres):
#   TMDB_API_KEY
