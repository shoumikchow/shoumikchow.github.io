name = "shoumikchow-terminal"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# No workers.dev URL — this only ever runs on the apex route below.
workers_dev = false

# One exact route per page, deliberately not shoumikchow.com/* . Assets, PDFs,
# /.well-known/*, sitemap.xml and the .md files themselves never reach the
# worker, so the failure domain stays small and the .md subrequest below cannot
# re-enter the route. Cost: a new page needs a line here, and until it gets one
# it just serves HTML to curl.
routes = [
  { pattern = "shoumikchow.com/", zone_name = "shoumikchow.com" },
  { pattern = "shoumikchow.com/about", zone_name = "shoumikchow.com" },
  { pattern = "shoumikchow.com/experience", zone_name = "shoumikchow.com" },
  { pattern = "shoumikchow.com/research", zone_name = "shoumikchow.com" },
  { pattern = "shoumikchow.com/projects", zone_name = "shoumikchow.com" }
]
