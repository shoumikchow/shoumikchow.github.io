<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    /* Deliberately inlined so this page still renders if the stylesheet is the
       thing that 404'd. Keep in sync with _sass/jekyll-theme-minimal.scss. */
    /* AAA (7:1) tones — must track the ramp in the theme. See the note there
       for why they are this dark and how the values were derived. */
    :root {
      --bg: #faf4ed;
      --fg: #37334e;        /* 11.01:1 */
      --fg-muted: #47445e;  /*  8.52:1 */
      --fg-faint: #535069;  /*  7.07:1 */
      --rule: #b9b1af;
      --gold: #714b12;
      --surface: rgba(87, 82, 121, 0.062);
      --surface-hover: rgba(87, 82, 121, 0.105);
    }
    [data-theme="dark"] {
      --bg: #0f0e0d;
      --fg: #ece7e1;        /* 15.69:1 */
      --fg-muted: #b0aca6;  /*  8.54:1 */
      --fg-faint: #a09c96;  /*  7.06:1 */
      --rule: #423c37;
      --gold: #f6c177;
      --surface: rgba(236, 231, 225, 0.055);
      --surface-hover: rgba(236, 231, 225, 0.095);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg-muted);
      font: 400 14px/1.7 "Noto Sans", "Helvetica Neue", Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 400px; padding: 20px; }
    .code {
      font-size: 72px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 12px;
    }
    .message {
      font-size: 14px;
      color: var(--fg-faint);
      margin-bottom: 32px;
    }
    /* The nav pill's shape, but filled solid.
       Two earlier versions read as decoration rather than as a control: the
       hand-drawn squiggly ring (a wobbly hairline around text looks like a
       decorated caption) and then the nav pill proper. The pill fails here for
       a reason that is not the pill's fault — in the sidebar it is one of four
       in a stack, and the repetition is what says "these are controls". Alone
       and centred on an empty page, a 6% tint says nothing at all.
       So: same radius, same type, but a solid fill and an arrow. This is the
       only way off the page and it should look like it. Inverting --fg/--bg
       keeps it inside the palette and measures the same 11:1 as body text. */
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 44px;
      color: var(--bg);
      background: var(--fg);
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.02em;
      padding: 0 20px;
      border: 0;
      border-radius: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
    }
    /* The arrow is generated rather than typed so it cannot end up inside the
       link's accessible name, which should stay the sentence alone. */
    a::after {
      content: "→";
      font-size: 15px;
      line-height: 1;
      transition: transform 0.2s ease;
    }
    a:hover {
      opacity: 0.9;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
    }
    a:hover::after { transform: translateX(3px); }
    a:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 3px;
    }
    @media (prefers-reduced-motion: reduce) {
      a, a::after { transition: none; }
      a:hover { transform: none; }
      a:hover::after { transform: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <p class="message">My dog, Neira, ate this page. She is not sorry.</p>
    <a href="/">Somewhere she has not been</a>
  </div>
</body>
</html>
