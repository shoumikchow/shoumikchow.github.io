layout: none
title: "Page Not Found"
permalink: /404.html
---
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Page Not Found</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <script>
    (function() {
      const theme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <style>
    /* Deliberately inlined so this page still renders if the stylesheet is the
       thing that 404'd. Keep in sync with _sass/jekyll-theme-minimal.scss. */
    :root {
      --bg: #faf4ed;
      --fg: #575279;
      --fg-muted: #797593;
      --fg-faint: #9893a5;
      --rule: #dfdad9;
    }
    [data-theme="dark"] {
      --bg: #0f0e0d;
      --fg: #ece7e1;
      --fg-muted: #a39d96;
      --fg-faint: #7a746c;
      --rule: #262320;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--fg-muted);
      font: 400 14px/1.7 "Noto Sans", "Helvetica Neue", Helvetica, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 400px; padding: 20px; }
    .code {
      font-size: 72px;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.04em;
      line-height: 1;
      margin-bottom: 12px;
    }
    .message {
      font-size: 14px;
      color: var(--fg-faint);
      margin-bottom: 32px;
    }
    /* The border is transparent because the visible one is drawn on ::before —
       see below. It stays here so the button's box does not change size. */
    a {
      position: relative;
      color: var(--fg);
      text-decoration: none;
      font-weight: 500;
      font-size: 13px;
      padding: 8px 20px;
      border: 1px solid transparent;
      transition: all 0.2s ease;
      display: inline-block;
    }
    a:hover {
      background: rgba(128, 128, 128, 0.05);
    }
    /* The home button borrows the hand-drawn border from the site's theme
       toggle. The border sits on a pseudo-element so the filter cannot smear
       the label, and the filter itself is inlined below for the same reason the
       palette is: this page has to stand on its own. */
    a::before {
      content: "";
      position: absolute;
      inset: -1px;
      border: 1.25px solid var(--rule);
      border-radius: 8px;
      filter: url("#squiggle-404");
    }
    a:hover::before { border-color: var(--fg-faint); }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <p class="message">My dog, Neira, ate this page. She is not sorry.</p>
    <a href="/">Somewhere she has not been</a>
  </div>

  <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
    <filter id="squiggle-404" x="-20%" y="-60%" width="140%" height="220%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="1" seed="0" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="25" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </svg>

</body>
</html>
